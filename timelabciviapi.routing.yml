timelabciviapi.search_contact:
  path: '/timelabcivi/individuals'
  defaults:
    _controller: '\Drupal\timelabciviapi\Controller\TimelabCiviApiController::searchIndividual'
  methods: [GET]
  requirements:
    _access: 'TRUE'

timelabciviapi.get_contact:
  path: '/timelabcivi/individuals/{id}'
  defaults:
    _controller: '\Drupal\timelabciviapi\Controller\TimelabCiviApiController::getIndividual'
  methods: [GET]
  requirements:
    _access: 'TRUE'
    id: '\d+'

timelabciviapi.search_project:
  path: '/timelabcivi/projects'
  defaults:
    _controller: '\Drupal\timelabciviapi\Controller\TimelabCiviApiController::searchProject'
  methods: [GET]
  requirements:
    _access: 'TRUE'

timelabciviapi.get_project:
  path: '/timelabcivi/projects/{id}'
  defaults:
    _controller: '\Drupal\timelabciviapi\Controller\TimelabCiviApiController::getProject'
  methods: [GET]
  requirements:
    _access: 'TRUE'
    id: '\d+'

timelabciviapi.search_event:
  path: '/timelabcivi/events'
  defaults:
    _controller: '\Drupal\timelabciviapi\Controller\TimelabCiviApiController::searchEvent'
  methods: [GET]
  requirements:
    _access: 'TRUE'


